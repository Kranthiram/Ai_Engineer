[project]
name = "hireme-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kranthiram", email = "alugulakranthiram@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
hireme-ai = "hireme_ai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
